spring:
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: password_manager
        hibernate.hbm2ddl.auto: create-drop
  datasource:
    driver-class-name: org.postgresql.Driver

app:
  rate-limiting:
    ip-enabled: true
    default-window-seconds: 3
  security:
    totp-encryption-key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef